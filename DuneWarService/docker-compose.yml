services:
  postgres:
    image: postgres:16-alpine
    container_name: dune-war-postgres
    environment:
      POSTGRES_DB: CSharpCornerDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: avaria
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CSharpCornerDB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dune-war-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dune-war-server
    ports:
      - "4000:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      # Переопределяем строку подключения: в контейнере БД доступна по имени сервиса "postgres"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=CSharpCornerDB;Username=postgres;Password=avaria"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data: